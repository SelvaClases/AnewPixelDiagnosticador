<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnosticador | anew pixel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <template id="plantilla-cohete">
    <img src="assets/progress-rocket.png" alt="" aria-hidden="true">
  </template>

  <main>
    <section id="inicio" class="pantalla pantalla-inicio">
      <div class="contenido">
        <img class="logo logo-grande" src="assets/Logo-anewpixel.svg" alt="anew pixel">
        <p class="etiqueta">Descubre</p>
        <h1 class="titulo-inicio"><span class="ligero">Dónde está tu</span> <strong>próxima oportunidad de crecimiento</strong></h1>
        <p class="descripcion">Responde unas preguntas y nuestro diagnosticador analizará si tu negocio está aprovechando todo su potencial.</p>
        <button id="comenzar" class="boton-principal" type="button">
          <span>Descubrir mi oportunidad</span>
          <img class="flecha" src="assets/arrow_r_svg.svg" alt="" aria-hidden="true">
        </button>
        <p id="error" class="error" role="alert" hidden></p>
      </div>
    </section>

    <section id="cuestionario" class="pantalla pantalla-pregunta" hidden>
      <div class="columna">
        <header class="cabecera">
          <button id="atras" type="button" aria-label="Volver a la pregunta anterior">
            <img src="assets/back_svg.svg" alt="" aria-hidden="true">
          </button>
          <img class="logo logo-chico" src="assets/Logo-anewpixel.svg" alt="anew pixel">
          <span class="contador"><strong id="actual">1</strong>/<span id="total">13</span></span>
        </header>
        <div id="progreso" class="progreso"></div>
        <h2 id="pregunta" class="pregunta"></h2>
        <div id="alternativas" class="alternativas"></div>
        <div class="acciones-pregunta" hidden>
          <button id="continuar" class="boton-principal" type="button">Continuar</button>
        </div>
      </div>
    </section>

    <section id="contacto" class="pantalla pantalla-pregunta" hidden>
      <div class="columna">
        <header class="cabecera">
          <button id="atras-contacto" type="button" aria-label="Volver a las preguntas">
            <img src="assets/back_svg.svg" alt="" aria-hidden="true">
          </button>
          <img class="logo logo-chico" src="assets/Logo-anewpixel.svg" alt="anew pixel">
          <span></span>
        </header>
        <h2 class="pregunta"><span class="ligero">Último paso</span> <strong>¿A quién le mostramos el diagnóstico?</strong></h2>
        <form id="formulario-contacto" class="formulario">
          <label class="campo">Nombre completo *
            <input type="text" name="nombre" required maxlength="120" autocomplete="name">
          </label>
          <label class="campo">Empresa
            <input type="text" name="empresa" maxlength="120" autocomplete="organization">
          </label>
          <label class="campo">Correo electrónico *
            <input type="email" name="correo" required maxlength="160" autocomplete="email">
          </label>
          <label class="campo">Teléfono
            <input type="tel" name="telefono" maxlength="40" autocomplete="tel">
          </label>
          <p id="error-contacto" class="error" role="alert" hidden></p>
          <button id="enviar" class="boton-principal" type="submit">
            <span>Ver mi diagnóstico</span>
          </button>
        </form>
      </div>
    </section>

    <section id="resultado" class="pantalla pantalla-pregunta" hidden>
      <div class="columna">
        <img class="logo logo-chico centrado" src="assets/Logo-anewpixel.svg" alt="anew pixel">
        <p class="etiqueta etiqueta-resultado">Tu diagnóstico</p>
        <h2 id="titulo-resultado" class="pregunta"></h2>
        <div id="areas" class="areas"></div>
        <button id="reiniciar" class="boton-principal" type="button">
          <span>Volver a empezar</span>
        </button>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
